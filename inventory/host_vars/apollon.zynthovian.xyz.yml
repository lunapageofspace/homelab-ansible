named_listening_port: 53

named_additional_options:
  - "listen-on port {{ named_listening_port }} { any; };"
  - "listen-on-v6 port {{ named_listening_port }} { any; };"
  - "allow-query	{ allowed_clients; };"
  - "recursion no;"
  - "allow-recursion { allowed_clients; };"
  - "dnssec-validation auto;"

named_includes:
  - name: acls.conf
    content: |
      acl allowed_clients {
        // Localhost
        localhost;
        127.0.0.1/32;
        // Management Network
        172.22.0.0/24;
      };
  - name: tsig.conf
    content: |
      key "kubernetes" {
        algorithm hmac-sha256;
        secret "{{ kubernetes_dns_key }}";
      };
  - name: zones.conf
    content: |
      zone "zynthovian.xyz" {
        type master;
        file "/var/named/zones/zynthovian-xyz.db";
        allow-transfer { key "kubernetes"; };
        update-policy { grant kubernetes zonesub ANY; };
      };
  - name: logging.conf
    content: |
      logging {
        category lame-servers { null; };
      };

