- name: Open listening port for named
  ansible.posix.firewalld:
    immediate: true
    permanent: true
    port: "{{ named_listening_port }}/{{ item }}"
    state: enabled
  loop:
    - tcp
    - udp

- name: Enable and start the named service
  ansible.builtin.service:
    name: named
    state: started
    enabled: true
    daemon_reload: true
