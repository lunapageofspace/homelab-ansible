---
- name: Install ISC Bind9
  notify: "restart named"
  ansible.builtin.dnf:
    name: bind
    state: present

- name: Create zones folder for bind
  notify: "restart named"
  ansible.builtin.file:
    path: /var/named/zones
    state: directory
    owner: named
    group: named
    mode: "u=rwx,g=rwx,o="

- name: Template zonefiles
  notify: "restart named"
  loop: "{{ named_zone_files }}"
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "/var/named/zones/{{ item.name }}.db"
    owner: named
    group: named
    mode: "u=r,g=r,o="

- name: Template BIND configuration
  notify: "restart named"
  ansible.builtin.copy:
    content: "{{ lookup('template', 'named.conf.j2') }}"
    dest: "/etc/named.conf"
    owner: root
    group: named
    mode: "u=rw,g=r,o="

- name: Template BIND drop-in configuration
  notify: "restart named"
  loop: "{{ named_includes }}"
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "/etc/named/{{ item.name }}"
    owner: root
    group: named
    mode: "u=rw,g=r,o="

